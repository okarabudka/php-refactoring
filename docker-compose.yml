services:
  app:
    build: ./docker
    image: akrbdk/php_refactoring
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www
    extra_hosts:
      - host.docker.internal:host-gateway

  db:
    image: mysql:8.0
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql-config.cnf:/etc/mysql/conf.d/config.cnf
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: php_refactoring
      MYSQL_USER: php_refactoring
      MYSQL_PASSWORD: php_refactoring

volumes:
  mysql-data:
